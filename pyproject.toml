[project]
name = "stockcapy"
version = "0.2.0"
description = "StockCapy — 美股合理價、入手價與到價提醒。淡定等到價。"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "yfinance>=0.2.54",
    "pandas>=2.2",
    "numpy>=1.26",
    "rich>=13.7",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
]

[project.scripts]
stockcapy = "portfolio.cli:app"
sc = "portfolio.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
# Only needed to regenerate the mascot PNGs in tools/.
icons = ["pillow>=11.0", "numpy>=1.26"]
# Optional: the LLM "second layer" narrator (PORTFOLIO_LLM_NARRATION=1). Off by
# default; the deterministic template needs none of this.
llm = ["anthropic>=0.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
